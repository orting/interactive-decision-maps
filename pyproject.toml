[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "idm-viewer"
version = "0.1.0"
description = "Interactive Decision Map viewer with brushing, PCP, color-by, and dark mode."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

authors = [
    { name = "Silas Nyboe Ørting" }
]

dependencies = [
    "dash>=3.0",
    "plotly>=5.0",
    "numpy>=1.21",
    "pandas>=1.5",
]

[project.scripts]
idm-viewer = "idm_viewer.app:main"

[tool.setuptools]
package-data = { "idm_viewer" = ["assets/*"] }